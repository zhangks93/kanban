services:
  db:
    build:
      context: .
      dockerfile: infra/Dockerfile.postgres
    environment:
      POSTGRES_DB: work_platform
      POSTGRES_PASSWORD: localdev
    ports: ['54322:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      retries: 20
volumes:
  postgres-data:
